name: Cloud Compiler

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  # 1. LINTING JOB
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linter
        run: python -m pip install flake8

      - name: Check for Fatal Syntax Errors
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  # 2. WINDOWS BUILD
  build-windows:
    needs: lint
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Copy FFmpeg & FFprobe to Root
        shell: bash
        run: |
          cp $(which ffmpeg.exe) .
          cp $(which ffprobe.exe) .

      - name: Install Python Dependencies
        run: python -m pip install --upgrade pip pyinstaller yt-dlp psutil Pillow requests mutagen

      - name: Compile Windows Executable
        run: |
          pyinstaller --noconsole --onefile --clean --name "PSP-Media-Suite-Win" --icon="icon.ico" --add-binary "ffmpeg.exe;." --add-binary "ffprobe.exe;." --add-data "Icon.png;." --hidden-import PIL._tkinter_finder app.py

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PSP-Media-Suite-Windows
          path: dist/PSP-Media-Suite-Win.exe

  # 3. LINUX BUILD
  build-linux:
    needs: lint
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk zip wget xz-utils

      - name: Download Static FFmpeg & FFprobe
        run: |
          wget https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          tar -xf ffmpeg-release-amd64-static.tar.xz
          cp ffmpeg-*-static/ffmpeg .
          cp ffmpeg-*-static/ffprobe .
          chmod +x ffmpeg ffprobe

      - name: Install Python Dependencies
        run: python -m pip install --upgrade pip pyinstaller yt-dlp psutil Pillow requests mutagen

      - name: Compile Linux Binary
        run: |
          pyinstaller --noconsole --onefile --clean --name "app" --add-binary "ffmpeg:." --add-binary "ffprobe:." --add-data "Icon.png:." --hidden-import PIL._tkinter_finder app.py

      - name: Package Linux ZIP
        run: |
          mkdir linux_package
          cp dist/app linux_package/
          cp Icon.png linux_package/
          cp install.sh linux_package/ || true
          cp Installation_instructions.txt linux_package/ || true
          cd linux_package
          zip -r ../PSP-Media-Suite-Linux.zip .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PSP-Media-Suite-Linux
          path: PSP-Media-Suite-Linux.zip

  # 4. MAC BUILD
  build-mac:
    needs: lint
    runs-on: macos-15-intel
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Copy FFmpeg & FFprobe to Root
        run: |
          cp $(which ffmpeg) .
          cp $(which ffprobe) .
          chmod +x ffmpeg ffprobe

      - name: Install Python Dependencies
        run: python -m pip install --upgrade pip pyinstaller yt-dlp psutil Pillow requests mutagen

      - name: Compile Mac App
        run: |
          pyinstaller --noconsole --onefile --clean --name "PSP-Media-Suite-Mac" --add-binary "ffmpeg:." --add-binary "ffprobe:." --add-data "Icon.png:." --hidden-import PIL._tkinter_finder app.py

      - name: Package Mac ZIP
        run: |
          mkdir mac_package
          cp -r dist/PSP-Media-Suite-Mac.app mac_package/
          cp Installation_instructions.txt mac_package/ || true
          cd mac_package
          zip -r ../PSP-Media-Suite-Mac.zip .

      - name: Upload Mac Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PSP-Media-Suite-Mac
          path: PSP-Media-Suite-Mac.zip

  # 5. PUBLISH RELEASE
  publish-release:
    needs: [build-windows, build-linux, build-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Compiled Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/PSP-Media-Suite-Windows/PSP-Media-Suite-Win.exe
            artifacts/PSP-Media-Suite-Linux/PSP-Media-Suite-Linux.zip
            artifacts/PSP-Media-Suite-Mac/PSP-Media-Suite-Mac.zip
            Installation_instructions.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
